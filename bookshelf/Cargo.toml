[package]
name = "bookshelf"
version = "0.1.0"
edition = "2024"
description = "Bookshelf: a small e-book library and reader (EPUB, TXT) with automatic cover download and reading position memory."

[dependencies]
dirs = "6"
eframe = "0.37"
epub = "2.1"
html2text = { version = "0.17", features = ["xml"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
rfd = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }

[profile.release]
opt-level = 3
strip = true

# Parse EPUBs and decode cover images at a reasonable speed even in debug builds.
[profile.dev.package."*"]
opt-level = 2
